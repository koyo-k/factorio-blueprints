[project]
name = "fbp"
version = "0.1.0"
description = "Factorio blueprint development toolkit (build / validate / render / simulate)"
requires-python = ">=3.11"
dependencies = [
    "factorio-draftsman>=4.0.1",
    "pillow>=10",
]

[project.scripts]
fbp = "fbp.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fbp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::draftsman.warning.DraftsmanWarning"]
